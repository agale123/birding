<!doctype html>
<html>
  <head>
    <title>Year of Birds</title>
    <meta name="description" content="p5.js CDN Template" />
    <script src="https://cdn.jsdelivr.net/npm/p5@1.10.0/lib/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.6.0/addons/p5.dom.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script src="https://d3js.org/d3.v4.js"></script>
    <script src="https://d3js.org/d3-scale-chromatic.v1.min.js"></script>
    <script src="https://d3js.org/d3-geo-projection.v2.min.js"></script>
    <script src="index.js"></script>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <main class="d-flex flex-column h-100">
      <div class="container">
        <header
          class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom"
        >
          <h3>2026 in Birds:</h3>
          <select
            class="form-select ms-2 w-auto"
            id="state-select"
            onChange="onStateChanged()"
          ></select>
        </header>
      </div>
      <div class="container d-flex justify-content-between align-items-center">
        <button
          type="button"
          class="btn btn-outline-secondary d-flex align-items-center"
          onClick="onBirdChanged(-1)"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            class="bi bi-arrow-left"
            viewBox="0 0 16 16"
          >
            <path
              fill-rule="evenodd"
              d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"
            ></path>
          </svg>
        </button>
        <div>
          <h4>
            <span id="position"></span>.
            <span id="bird"></span>
          </h4>
        </div>
        <button
          type="button"
          class="btn btn-outline-secondary d-flex align-items-center"
          onClick="onBirdChanged(1)"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            class="bi bi-arrow-right"
            viewBox="0 0 16 16"
          >
            <path
              fill-rule="evenodd"
              d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8"
            />
          </svg>
        </button>
      </div>
      <div class="w-100 flex-grow-1" style="overflow:auto">
        <div class="container d-flex justify-content-between h-75">
          <div class="w-50 p-4" id="map-container">
            <svg id="map" class="w-100 h-100"></svg>
          </div>
          <div class="w-50">
            <ul id="carousel" class="hide-scrollbar"></ul>
          </div>
        </div>
        <div class="container h-25" id="timeline"></div>
      </div>
    </main>
  </body>
</html>
