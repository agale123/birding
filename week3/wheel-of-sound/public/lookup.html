<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bird Lookup</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; color: #fff; font-family: sans-serif;
           display: flex; flex-direction: column; align-items: center;
           justify-content: center; height: 100vh; gap: 20px; }
    #search-row { display: flex; gap: 8px; }
    input { padding: 10px 16px; font-size: 16px; border-radius: 6px;
            border: 1px solid #444; background: #222; color: #fff;
            width: 280px; outline: none; }
    input:focus { border-color: #888; }
    button { padding: 10px 20px; font-size: 16px; border-radius: 6px;
             border: none; background: #fff; color: #111; cursor: pointer; }
    button:hover { background: #ddd; }
    #result { text-align: center; min-height: 240px; display: flex;
              flex-direction: column; align-items: center; gap: 12px; }
    #result img { width: 220px; height: 220px; object-fit: cover;
                  border-radius: 12px; border: 2px solid #444; }
    #result p { font-size: 18px; color: #eee; }
    #result .hint { font-size: 13px; color: #777; }
    #result .error { color: #f88; font-size: 14px; }
  </style>
</head>
<body>

<div id="search-row">
  <input id="query" type="text" placeholder="e.g. amerob, Turdus migratorius, American Robin" />
  <button onclick="lookupBird()">Look up</button>
</div>

<div id="result">
  <p class="hint">Enter a common name, scientific name, or eBird species code (e.g. amerob)</p>
</div>

<script>
  /*
    getBird() — look up a bird and get back its name and image
    ----------------------------------------------------------
    You give this function a bird's name or code, and it gives you
    back an object with the bird's name and a URL for its photo.

    You can pass in any of these:
      - An eBird species code, like "amerob" (American Robin)
      - A scientific name, like "Turdus migratorius"
      - A common English name, like "American Robin"

    When it's done, you get back an object that looks like this:
      {
        name:       "American Robin",
        imageUrl:   "https://commons.wikimedia.org/...",  // use this in an <img> tag
        wikidataId: "Q48226"                              // Wikidata's ID for this bird
      }

    If no bird was found, it returns null instead of an object,
    so always check: if (bird) { ... } before using it.

    Where does the data come from?
    Wikidata (wikidata.org) is a free database of facts about the world,
    including facts about every bird species — their names, photos, and codes.
    We ask Wikidata questions using a query language called SPARQL.
    No API key is needed, and it works directly from the browser.
  */

  // This is the address of the Wikidata query service we'll send our questions to.
  const SPARQL_ENDPOINT = "https://query.wikidata.org/sparql";

  async function getBird(input) {
    const s = input.trim();

    // Build the right question (query) for Wikidata based on what kind of input we have
    const query = buildSparqlQuery(s);

    // Attach the query to the Wikidata URL and fetch the results
    const url = SPARQL_ENDPOINT + "?query=" + encodeURIComponent(query);
    const res = await fetch(url, { headers: { Accept: "application/sparql-results+json" } });
    const data = await res.json();

    // Wikidata returns results as an array called "bindings" — each item is one match.
    // We asked for only 1 result (LIMIT 1), so we just grab the first one.
    const b = data.results.bindings[0];
    if (!b) return null; // nothing found

    const rawImage = b.image?.value ?? null;
    return {
      name: b.itemLabel?.value ?? s,
      // Wikidata identifies every item with a "Q number" — we pull it from the end of the URL
      wikidataId: b.item?.value.split("/").at(-1) ?? null,
      // Wikidata image URLs sometimes start with http:// — we swap to https:// to be safe
      imageUrl: rawImage
        ? rawImage.replace(
            "http://commons.wikimedia.org/wiki/Special:FilePath/",
            "https://commons.wikimedia.org/wiki/Special:FilePath/"
          )
        : null,
    };
  }

  /*
    buildSparqlQuery() — write the right Wikidata question for the input
    --------------------------------------------------------------------
    Wikidata stores facts as property–value pairs. Different properties
    hold different kinds of identifiers, so we pick the right one:

      P3444  = eBird species code  (e.g. "amerob")
      P225   = scientific name     (e.g. "Turdus migratorius")
      rdfs:label = the item's name in a given language (e.g. "American Robin")

    We figure out which property to use by looking at the shape of the input:
      - Short, no spaces → looks like an eBird code → use P3444
      - Two words, first capitalised → looks like a scientific name → use P225
      - Anything else → treat as a common English name → search by label
  */
  function buildSparqlQuery(s) {
    if (/^[A-Za-z0-9]{4,6}$/.test(s)) {
      // eBird codes are always stored in lowercase in Wikidata
      return `SELECT ?item ?itemLabel ?image WHERE {
        ?item wdt:P3444 "${s.toLowerCase()}".
        OPTIONAL { ?item wdt:P18 ?image. }
        SERVICE wikibase:label { bd:serviceParam wikibase:language "en". }
      } LIMIT 1`;
    } else if (/^[A-Z][a-z]+ [a-z]+/.test(s)) {
      return `SELECT ?item ?itemLabel ?image WHERE {
        ?item wdt:P225 "${s}".
        OPTIONAL { ?item wdt:P18 ?image. }
        SERVICE wikibase:label { bd:serviceParam wikibase:language "en". }
      } LIMIT 1`;
    } else {
      // wdt:P31/wdt:P279* means "is a kind of taxon" — this stops us matching
      // non-bird things that happen to have the same name as a bird
      return `SELECT ?item ?itemLabel ?image WHERE {
        ?item wdt:P31/wdt:P279* wd:Q16521.
        ?item rdfs:label "${s}"@en.
        OPTIONAL { ?item wdt:P18 ?image. }
        SERVICE wikibase:label { bd:serviceParam wikibase:language "en". }
      } LIMIT 1`;
    }
  }

  // ---- UI ---------------------------------------------------------------
  // Everything below is the search box and display for this demo page.
  // To use getBird() in your own project, copy only the two functions above.

  document.getElementById("query").addEventListener("keydown", e => {
    if (e.key === "Enter") onLookup();
  });

  async function onLookup() {
    const input = document.getElementById("query").value;
    if (!input.trim()) return;

    const result = document.getElementById("result");
    result.innerHTML = "<p>Looking up…</p>";

    try {
      const bird = await getBird(input);
      if (!bird) {
        result.innerHTML = `<p class="error">No results found for "${input}"</p>
          <p class="hint">Try a different spelling, or use the eBird species code (e.g. amerob)</p>`;
        return;
      }
      if (bird.imageUrl) {
        result.innerHTML = `<img src="${bird.imageUrl}" alt="${bird.name}" /><p>${bird.name}</p>`;
      } else {
        result.innerHTML = `<p>${bird.name}</p>
          <p class="hint">No image found in WikiData for this species</p>`;
      }
    } catch (e) {
      result.innerHTML = `<p class="error">Error: ${e.message}</p>`;
    }
  }
</script>

</body>
</html>
